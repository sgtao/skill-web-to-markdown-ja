[project]
name = "skill-web-to-markdown"
version = "0.0.5"
description = "Web上のコンテンツ（HTML/PDF/Office/YouTube）をMarkdownへ変換するClaude Code用スキルセット"
requires-python = ">=3.10"
dependencies = [
    "markitdown[docx,xlsx,pptx]>=0.1.5",
    "trafilatura",
    "beautifulsoup4",
    "yt-dlp",
    "pypdf",
    "pdfplumber",
    "pypdfium2",
    "pillow",
]

[tool.uv]
package = false
